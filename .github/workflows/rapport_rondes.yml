name: 📊 Rapport Automatique des Rondes (ORBIS V3)

on:
  schedule:
    # 1. Rapport de Nuit à 06:00 NC (19:00 UTC la veille)
    - cron: '0 19 * * *'
    
    # 2. Rapport de Journée (WE & Fériés) à 20:00 NC (09:00 UTC le jour même)
    - cron: '0 9 * * *'

  # Permet un déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:

jobs:
  execution-rapport-rondes:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install supabase pandas holidays streamlit tenacity

      - name: 🚀 Exécution du script de rapport (Nuit & Journée)
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python utils/rapport_rondes.py