name: 📊 Rapport Quotidien des Rondes de Nuit (ORBIS V3)

on:
  schedule:
    # 19:00 UTC = 06:00 du matin heure de Nouméa (Pacific/Noumea, UTC+11)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  execution-rapport-rondes:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install supabase pandas holidays streamlit tenacity

      - name: 🚀 Exécution du script de rapport de nuit
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python utils/rapport_rondes.py